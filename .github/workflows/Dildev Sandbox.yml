name: Dildev Sandbox

on:
  push:
    branches:
      - master
  workflow_dispatch:

########################################################
# VALIDATION JOB
########################################################
jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    environment: dildev-sandbox

    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_dildev }}
      ORG_ALIAS: dildev-sandbox

    container:
      image: salesforce/cli:2.123.1-full

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify SFDX Auth URL
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::SFDX_AUTH_URL_dildev secret is missing or empty"
            exit 1
          fi

      - name: Authenticate to Sandbox
        shell: bash
        run: |
          sf org login sfdx-url \
            --alias "$ORG_ALIAS" \
            --set-default \
            --sfdx-url-file <(echo "$SFDX_AUTH_URL")

      - name: Validate Deployment
        working-directory: bin/Source
        run: |
          echo "Validating deployment..."

          sf project deploy start \
            --dry-run \
            --manifest manifest/package.xml \
            --target-org "$ORG_ALIAS" \
            --test-level NoTestRun \
            --wait 30

          echo "✅ Validation successful"

########################################################
# DEPLOYMENT JOB
########################################################
  deploy-to-dildev:
    name: Deploy to Dildev Sandbox
    runs-on: ubuntu-latest
    needs: validate
    environment: dildev-sandbox

    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_dildev }}
      ORG_ALIAS: dildev-sandbox

    container:
      image: salesforce/cli:2.123.1-full

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Sandbox
        shell: bash
        run: |
          sf org login sfdx-url \
            --alias "$ORG_ALIAS" \
            --set-default \
            --sfdx-url-file <(echo "$SFDX_AUTH_URL")

      - name: Deploy Metadata
        working-directory: bin/Source
        run: |
          echo "Starting deployment..."

          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org "$ORG_ALIAS" \
            --test-level NoTestRun \
            --wait 30

          echo "✅ Deployment successful"
