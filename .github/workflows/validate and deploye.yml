name: Salesforce Delta Validate and Deploy

on:
  push:
    branches:
      - mbcrm3
  workflow_dispatch:

jobs:
  # STAGE 1: VALIDATION (Runs automatically)
  validate:
    runs-on: ubuntu-latest
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_dildev }}
      ORG_ALIAS: rmteam@mbcrm.com.dildev
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate Salesforce Org
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --set-default \
            --alias "$ORG_ALIAS"
          rm auth.txt

      - name: Generate Delta Package
        run: |
          mkdir -p changed-sources
          sf sgd source delta \
            --to HEAD \
            --from HEAD~1 \
            --output changed-sources \
            --generate-delta

          echo "Generated package.xml:"
          cat changed-sources/package/package.xml

      - name: Check if there are metadata changes
        id: check_changes
        run: |
          if grep -q "<types>" changed-sources/package/package.xml; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Read Test Classes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if [ ! -f config/test-classes.txt ]; then
            echo "No test-classes.txt found."
            echo "TEST_CLASSES=" >> $GITHUB_ENV
            exit 0
          fi

          TEST_CLASSES=$(grep -v '^[[:space:]]*$' config/test-classes.txt | tr '\n' ',' | sed 's/,$//')
          echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV

          if [ -n "$TEST_CLASSES" ]; then
            echo "Running specified tests:"
            echo "$TEST_CLASSES"
          else
            echo "No test classes specified."
          fi

      - name: Validate Delta Components (Dry-Run)
        if: steps.check_changes.outputs.has_changes == 'true'
       # working-directory: bin/Source
        run: |
          if [ -n "$TEST_CLASSES" ]; then
            sf deploy metadata \
              --manifest ../../changed-sources/package/package.xml \
              --target-org "$ORG_ALIAS" \
              --test-level RunSpecifiedTests \
              --tests "$TEST_CLASSES" \
              --wait 60 \
              --dry-run
          else
            sf deploy metadata \
              --manifest ../../changed-sources/package/package.xml \
              --target-org "$ORG_ALIAS" \
              --test-level NoTestRun \
              --wait 60 \
              --dry-run
          fi
          echo "✅ Validation Successful"

      - name: Logout
        if: always()
        run: |
          sf org logout --all --no-prompt

  # STAGE 2: DEPLOYMENT (Pauses here for RM Team approval)
  deploy:
    runs-on: ubuntu-latest
    needs: validate # Ensures validation must pass first
    if: needs.validate.outputs.has_changes == 'true'
    
    # This links the job to your GitHub environment rules
    environment: production-dildev 
    
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_dildev }}
      ORG_ALIAS: rmteam@mbcrm.com.dildev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate Salesforce Org
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --set-default \
            --alias "$ORG_ALIAS"
          rm auth.txt

      - name: Regenerate Delta Package for Deployment
        run: |
          mkdir -p changed-sources
          sf sgd source delta \
            --to HEAD \
            --from HEAD~1 \
            --output changed-sources \
            --generate-delta

      - name: Deploy Delta Components
        working-directory: bin/Source
        run: |
          echo "Starting Deployment..."
          DEPLOY_RESULT=$(sf deploy metadata \
            --manifest ../../changed-sources/package/package.xml \
            --target-org "$ORG_ALIAS" \
            --test-level NoTestRun \
            --wait 60 \
            --json || true)

          echo "$DEPLOY_RESULT" | jq '.'
          DEPLOY_STATUS=$(echo "$DEPLOY_RESULT" | jq -r '.result.status // empty')

          if [ "$DEPLOY_STATUS" != "Succeeded" ]; then
            echo "::error::Deployment failed"
            echo "$DEPLOY_RESULT" | jq -r '.result.details.componentFailures[]?.problem // "Unknown error"'
            exit 1
          fi
          echo "✅ Deployment Successful"

      - name: Logout
        if: always()
        run: |
          sf org logout --all --no-prompt
