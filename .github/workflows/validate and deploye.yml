name: Salesforce Delta Validate and Deploy

on:
  pull_request:
    branches:
      - mbcrm3
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_dildev }}
      ORG_ALIAS: rmteam@mbcrm.com.dildev
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Repository Structure
        run: |
          pwd
          ls -la
          find . -name "sfdx-project.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate Salesforce Org
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --set-default \
            --alias "$ORG_ALIAS"
          rm auth.txt
      - name: Filter Committed Files
        shell: bash
        run: |
          source="$GITHUB_WORKSPACE"
          printf "Present working directory %s directory\n" "$source"
          echo " "
          cd "$source" || return
          
          # Create the staging directory (equivalent to Build.ArtifactStagingDirectory)
          destdir="$GITHUB_WORKSPACE/artifacts_staging"
          mkdir -p "$destdir"

          git diff HEAD~1 HEAD --name-only --diff-filter=MRCAD > diff.txt
          
          filelist="diff.txt"
          while read -r line; do
            # Skip if the file was deleted in git (cp will fail if it doesn't exist)
            if [ ! -f "$line" ]; then
              echo "File deleted or does not exist: $line"
              continue
            fi

            full_name=$line
            folderpath=${full_name%/*} 
            filebase=${full_name##*/} 
            fileext=${filebase##*.} 
            fileref=${filebase%.*} 
            filered=${fileref%.*} 
            filereff=${filebase#*.} 

            # Ignore .profileSessionSetting-meta.xml and .profilePasswordPolicy-meta.xml
            if [[ "$filereff" == "profileSessionSetting-meta.xml" || "$filereff" == "profilePasswordPolicy-meta.xml" ]]; then
                echo "Skipping $line"
                continue
            fi

            if echo "$filereff" | grep -o ".*-meta.*"; then
              echo "FILE NAME IS $line"
              cp --parent "$line" "$destdir"/
              echo "****This is meta file*****"
              val=$(echo "$filereff" | sed 's/-meta.*//')
              echo "$val"
              linee="$folderpath/$filered.$val"
              echo "$linee"
              if test -f "$linee"; then 
                cp --parent "$linee" "$destdir"/
              else 
                echo "$linee File Not Exists and does not have its dependencies"
              fi
            else
              cp --parent "$line" "$destdir"/
              echo "****This is component file****"
              val="-meta.xml"
              echo "$val"
              linee="$folderpath/$filebase$val"
              echo "$linee"
              if test -f "$linee"; then 
                cp --parent "$linee" "$destdir"/
              else 
                echo "File Not exits"
              fi
            fi
          done < "$filelist"

          # aura, lwc, staticresources handling
          folderlist=("aura" "lwc" "staticresources")
          while read -r lined; do
            full_name=$lined
            for name in "${folderlist[@]}"; do
              if echo "$full_name" | grep -q ".*$name.*"; then 
                echo "$name"
                folderpath=${full_name##*$name/}
                filename_e=${folderpath%%/*}
                echo "File path After $name folder/: $folderpath"
                echo "Filename from starting: $filename_e" 
                folderpath2=${full_name%$filename_e/*}
                echo "Folder path upto $name: $folderpath2"
                updatedpath=$folderpath2$filename_e
                echo "$updatedpath"
                if [ -d "$updatedpath" ]; then
                  find "$updatedpath/"* -exec cp --parent {} -r "$destdir"/ \;
                  echo "$updatedpath"
                  file=$(basename "$updatedpath")
                  echo "testing last folder $file"
                  ls "$folderpath2" | grep "^$file\..*" | while read -r vale; do 
                    echo "grepfiles:$folderpath2/$vale"
                    find "$folderpath2/$vale" -exec cp --parent '{}' "$destdir"/ \;      
                  done
                elif [ -f "$full_name" ]; then                
                  folderpath=${full_name%/*} 
                  filebase=${full_name##*/} 
                  fileref=${filebase%.*} 
                  filered=${fileref%.*}  
                  ls "$folderpath" | grep -e "^$filered\..*" -e "^$filered$" | while read -r vale; do 
                    echo "grepfiles:$folderpath/$vale"
                    find "$folderpath/$vale" -exec cp -r --parent '{}' "$destdir"/ \; 
                  done
                else
                  echo "NO file Found"
                fi
              fi
            done
          done < "$filelist"

      - name: Check if there are metadata changes
        id: check_changes
        run: |
          if [ ! -f changed-sources/package/package.xml ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if grep -q "<types>" changed-sources/package/package.xml; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Debug Output
        run: |
          echo "has_changes=${{ steps.check_changes.outputs.has_changes }}"

      - name: Read Test Classes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if [ ! -f config/test-classes.txt ]; then
            echo "TEST_CLASSES=" >> $GITHUB_ENV
            exit 0
          fi

          TEST_CLASSES=$(grep -v '^[[:space:]]*$' config/test-classes.txt | tr '\n' ',' | sed 's/,$//')
          echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV

      - name: Validate Delta Components
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if [ -n "$TEST_CLASSES" ]; then
            sf project deploy validate \
              --manifest changed-sources/package/package.xml \
              --target-org "$ORG_ALIAS" \
              --test-level RunSpecifiedTests \
              --tests "$TEST_CLASSES" \
              --wait 120
          else
            sf project deploy validate \
              --manifest changed-sources/package/package.xml \
              --target-org "$ORG_ALIAS" \
              --test-level NoTestRun \
              --wait 120
          fi
          echo "✅ Validation Successful"

      - name: Logout
        if: always()
        run: |
          sf org logout --all --no-prompt

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: |
      needs.validate.result == 'success' &&
      needs.validate.outputs.has_changes == 'true'
    environment: production-dildev
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_dildev }}
      ORG_ALIAS: rmteam@mbcrm.com.dildev

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Deploy Trigger
        run: |
          echo "Validation Result = ${{ needs.validate.result }}"
          echo "Has Changes = ${{ needs.validate.outputs.has_changes }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - name: Install sfdx-git-delta
        run: |
          echo y | sf plugins install sfdx-git-delta

      - name: Authenticate Salesforce Org
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --set-default \
            --alias "$ORG_ALIAS"
          rm auth.txt

      - name: Regenerate Delta Package
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            FROM_REF="origin/${{ github.base_ref }}"
          else
            FROM_REF="${{ github.event.before }}"
          fi

          if [ "$FROM_REF" = "0000000000000000000000000000000000000000" ] || [ -z "$FROM_REF" ]; then
            FROM_REF="HEAD~1"
          fi

          mkdir -p changed-sources

          sf sgd source delta \
            --to HEAD \
            --from "$FROM_REF" \
            --output-dir changed-sources \
            --generate-delta

      - name: Read Test Classes for Deploy
        run: |
          if [ ! -f config/test-classes.txt ]; then
            echo "TEST_CLASSES=" >> $GITHUB_ENV
            exit 0
          fi
          TEST_CLASSES=$(grep -v '^[[:space:]]*$' config/test-classes.txt | tr '\n' ',' | sed 's/,$//')
          echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV

      - name: Deploy Delta Components
        run: |
          echo "Starting Deployment..."
          if [ -n "$TEST_CLASSES" ]; then
            sf project deploy start \
              --manifest changed-sources/package/package.xml \
              --target-org "$ORG_ALIAS" \
              --test-level RunSpecifiedTests \
              --tests "$TEST_CLASSES" \
              --wait 120
          else
            sf project deploy start \
              --manifest changed-sources/package/package.xml \
              --target-org "$ORG_ALIAS" \
              --test-level NoTestRun \
              --wait 120
          fi
          echo "✅ Deployment Successful"

      - name: Logout
        if: always()
        run: |
          sf org logout --all --no-prompt
