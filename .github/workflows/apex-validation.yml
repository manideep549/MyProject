      # 5. Generate Delta Manifests (Package.xml)
      - name: Create Delta Packages
        run: |
          mkdir changed-sources
          
          # If triggered by a Pull Request, compare PR head to target base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output changed-sources/ --generate-delta
          else
            # If a direct push, compare current commit to previous commit
            sf sgd source delta --to "HEAD" --from "HEAD~1" --output changed-sources/ --generate-delta
          fi
          
          echo "--- Dynamic package.xml generated for changed metadata ---"
          cat changed-sources/package/package.xml

