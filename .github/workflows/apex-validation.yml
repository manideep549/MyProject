name: Salesforce Apex & LWC Delta Check-Only Validation

on:
  push:
    branches: [mbcrm ]
  pull_request:
    branches: [ mbcrm ]
    types: [ opened, synchronize, reopened ]

jobs:
  delta-validation:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository with full history (crucial for git diff execution)
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 3 # Fetches all history for all branches so Git can see changes

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install Salesforce CLI (sf)
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli
          sf --version

      # 4. Install the sfdx-git-delta plugin
      - name: Install sfdx-git-delta Plugin
        run: |
          echo 'y' | sf plugins install sfdx-git-delta
          sf plugins

      # 5. Generate Delta Manifests (Package.xml)
      # This compares the current commit against the destination target branch
      - name: Create Delta Packages
        run: |
          mkdir changed-sources
          
          # If triggered by a Pull Request, compare PR head to target base branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output changed-sources/ --generate-delta
          else
            # If a direct push, compare current commit to previous commit
            sf sgd source delta --to "HEAD" --from "HEAD~1" --output changed-sources/ --generate-delta
          fi
          
          echo "--- Dynamic package.xml generated for changed metadata ---"
          cat changed-sources/package/package.xml

      # 6. Authenticate to your Salesforce Org
      - name: Authenticate to Salesforce Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_dildev  }}" > sfdx_auth.txt
          sf org login sfdx-url --sfdx-url-file sfdx_auth.txt --set-default --alias targetOrg
          rm sfdx_auth.txt

      # 7. Check-Only Validation targeting ONLY generated delta elements
      - name: Validate Delta Components
        run: |
          # Only run if the package.xml actually contains elements to deploy
          if grep -q "<types>" changed-sources/package/package.xml; then
            sf project deploy validate \
              --manifest changed-sources/package/package.xml \
              --test-level RunLocalTests \
              --wait 45
          else
            echo "No deployable metadata changes found."
          fi
