name: Salesforce Delta CI (PMD + Tests)

on:
push:
branches: [dev, uat, main]
pull_request:
branches: [dev, uat, main]

jobs:
salesforce-ci:
runs-on: ubuntu-latest

```
steps:

# Checkout full history (IMPORTANT for delta)
- name: Checkout Source Code
  uses: actions/checkout@v4
  with:
    fetch-depth: 0

# Install Salesforce CLI
- name: Install Salesforce CLI
  run: |
    npm install @salesforce/cli --global
    sf version

# Install SFDX Git Delta Plugin
- name: Install SFDX Git Delta
  run: |
    sf plugins install sfdx-git-delta

# Install PMD
- name: Install PMD
  run: |
    wget https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip
    unzip pmd-dist-7.0.0-bin.zip
    echo "$(pwd)/pmd-bin-7.0.0/bin" >> $GITHUB_PATH

# Install jq
- name: Install jq
  run: |
    sudo apt-get update
    sudo apt-get install jq -y

########################################################
# STAGE 1 — Generate Delta Package
########################################################

- name: Generate Delta
  run: |
    echo "Generating delta package..."

    FROM_COMMIT=$(git rev-parse HEAD~1)
    TO_COMMIT=$(git rev-parse HEAD)

    sf sgd:source:delta \
      --to $TO_COMMIT \
      --from $FROM_COMMIT \
      --output delta

    echo "Delta generated"

    ls -R delta

########################################################
# STAGE 2 — Run PMD on Changed Apex Only
########################################################

- name: Run PMD on Delta Apex
  run: |
    echo "Running PMD on changed Apex classes"

    CHANGED_APEX=$(git diff --name-only HEAD~1 HEAD | grep '\.cls$' || true)

    if [ -z "$CHANGED_APEX" ]; then
      echo "No Apex changes found. Skipping PMD."
      exit 0
    fi

    echo "$CHANGED_APEX"

    for file in $CHANGED_APEX; do
      pmd check \
        --file "$file" \
        --rulesets category/apex/design.xml,category/apex/bestpractices.xml \
        --fail-on-violation
    done

########################################################
# STAGE 3 — Authenticate Salesforce Org
########################################################

- name: Authenticate Salesforce Org
  run: |
    echo "${{ secrets.SFDX_AUTH_URL_dildev }}" | sf org login sfdx-url \
      --alias ciOrg \
      --set-default \
      --sfdx-url-stdin

########################################################
# STAGE 4 — Detect Test Classes (Delta आधारित)
########################################################

- name: Detect Test Classes
  run: |
    echo "Detecting test classes from changed files..."

    TEST_CLASSES=""

    CHANGED_CLASSES=$(git diff --name-only HEAD~1 HEAD | grep '\.cls$' | sed 's#.*/##' | sed 's/.cls//' || true)

    for cls in $CHANGED_CLASSES; do
      TEST_CLASS="${cls}Test"

      if grep -q "class $TEST_CLASS" -R force-app; then
        if [ -z "$TEST_CLASSES" ]; then
          TEST_CLASSES="$TEST_CLASS"
        else
          TEST_CLASSES="$TEST_CLASSES,$TEST_CLASS"
        fi
      fi
    done

    if [ -z "$TEST_CLASSES" ]; then
      echo "No matching test classes found. Running all local tests."
      TEST_CLASSES="ALL"
    fi

    echo "TEST_CLASSES=$TEST_CLASSES" >> $GITHUB_ENV
    echo "Final Test List: $TEST_CLASSES"

########################################################
# STAGE 5 — Run Apex Tests
########################################################

- name: Run Apex Tests
  run: |
    echo "Running Apex Tests..."

    if [ "$TEST_CLASSES" = "ALL" ]; then
      sf apex test run \
        --target-org ciOrg \
        --test-level RunLocalTests \
        --wait 30 \
        --result-format json \
        --code-coverage \
        --output-dir test-results
    else
      sf apex test run \
        --target-org ciOrg \
        --tests "$TEST_CLASSES" \
        --wait 30 \
        --result-format json \
        --code-coverage \
        --output-dir test-results
    fi

########################################################
# STAGE 6 — Validate Results
########################################################

- name: Validate Results
  run: |
    RESULT_FILE="test-results/test-result.json"

    FAILURES=$(jq '.result.summary.failing' "$RESULT_FILE")

    echo "Failures: $FAILURES"

    if [ "$FAILURES" -gt 0 ]; then
      jq '.result.tests[] | select(.Outcome=="Fail")' "$RESULT_FILE"
      exit 1
    fi

    COVERAGE=$(jq -r '.result.summary.testRunCoverage' "$RESULT_FILE" | tr -d '%')

    echo "Coverage: $COVERAGE%"

    if [ "$COVERAGE" -lt 75 ]; then
      echo "Coverage below threshold"
      exit 1
    fi
